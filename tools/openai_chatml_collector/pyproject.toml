[project]
name = "openai-chatml-collector"
version = "0.1.0"
description = "A Gradio data collection tool for OpenAI-compatible chat APIs and ChatML SFT JSONL datasets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gradio>=6.15.1",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["app.py", "collector_core.py", "README.md"]
