[project]
name = "shoujen-llm"
version = "0.1.0"
description = "A toy char-level Chinese-first chatbot LLM with RWKV7+Attention hybrid"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4.0",
    "numpy>=1.26",
    "tqdm>=4.66",
    "datasets>=2.20",
    "protobuf>=5.0",
    "requests>=2.32",
    "safetensors>=0.4.5",
    "sentencepiece>=0.2.0",
    "pyyaml>=6.0",
    "transformers>=4.57.0",
    "accelerate>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
hpo = [
    "optuna>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shoujen"]
